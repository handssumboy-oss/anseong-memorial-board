<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>추모의 글 승인 관리</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;padding:2rem 1.25rem;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  .wrap{max-width:46rem;margin:0 auto}
  h1{font-size:1.1rem;font-weight:600;margin:0 0 1.5rem}
  input{width:100%;max-width:20rem;font:inherit;padding:.5rem .7rem;border:1px solid #ccc;border-radius:4px;margin-bottom:.75rem;display:block}
  button{font:inherit;padding:.45rem 1.1rem;border:1px solid #ccc;background:transparent;border-radius:4px;cursor:pointer}
  nav{display:flex;gap:.5rem;margin-bottom:2rem}
  nav button[aria-current="true"]{background:#333;color:#fff;border-color:#333}
  ul{list-style:none;margin:0;padding:0}
  li{border-top:1px solid #ddd;padding:1.25rem 0}
  .msg{white-space:pre-wrap;word-break:break-word;margin:0 0 .6rem}
  .meta{font-size:.82rem;color:#777;margin:0 0 .8rem}
  .acts{display:flex;gap:.5rem}
  .acts button{font-size:.85rem;padding:.35rem .9rem}
  .ok{border-color:#2f6b45;color:#2f6b45}
  .no{border-color:#9b3b3b;color:#9b3b3b}
  .note{color:#777;padding:2rem 0}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <section id="login">
    <h1>승인 관리 로그인</h1>
    <input id="email" type="email" placeholder="이메일" autocomplete="username">
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="signin" type="button">로그인</button>
    <p class="note" id="loginMsg"></p>
  </section>

  <section id="panel" hidden>
    <div class="bar">
      <h1 style="margin:0">추모의 글 승인 관리</h1>
      <button id="signout" type="button">로그아웃</button>
    </div>
    <nav id="tabs">
      <button data-status="pending" aria-current="true">대기</button>
      <button data-status="approved">게시됨</button>
      <button data-status="rejected">보류</button>
    </nav>
    <ul id="list"></ul>
    <p class="note" id="empty" hidden>해당하는 글이 없습니다.</p>
  </section>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const login    = document.getElementById("login");
const panel    = document.getElementById("panel");
const loginMsg = document.getElementById("loginMsg");
const list     = document.getElementById("list");
const empty    = document.getElementById("empty");

let current = "pending";

document.getElementById("signin").addEventListener("click", async () => {
  loginMsg.textContent = "확인하는 중입니다.";
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  loginMsg.textContent = error ? "로그인하지 못했습니다. 정보를 확인해 주세요." : "";
});

document.getElementById("signout").addEventListener("click", () => sb.auth.signOut());

sb.auth.onAuthStateChange((_event, session) => {
  const signedIn = Boolean(session);
  login.hidden = signedIn;
  panel.hidden = !signedIn;
  if (signedIn) load();
});

async function load() {
  const { data, error } = await sb
    .from("tributes")
    .select("*")
    .eq("status", current)
    .order("id", { ascending: false });

  const rows = error ? [] : (data || []);
  list.textContent = "";
  empty.hidden = rows.length > 0;

  for (const row of rows) {
    const li = document.createElement("li");

    const msg = document.createElement("p");
    msg.className = "msg";
    msg.textContent = row.message;

    const meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent = `${row.author} · ${new Date(row.created_at).toLocaleString("ko-KR")} · #${row.id}`;

    const acts = document.createElement("div");
    acts.className = "acts";
    if (current !== "approved") acts.appendChild(action(row.id, "approved", "게시", "ok"));
    if (current !== "rejected") acts.appendChild(action(row.id, "rejected", "보류", "no"));
    if (current !== "pending")  acts.appendChild(action(row.id, "pending", "대기로", ""));

    li.append(msg, meta, acts);
    list.appendChild(li);
  }
}

function action(id, status, label, cls) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.onclick = async () => {
    b.disabled = true;
    await sb.from("tributes").update({ status }).eq("id", id);
    load();
  };
  return b;
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-status]");
  if (!btn) return;
  current = btn.dataset.status;
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-current", String(b === btn));
  load();
});
</script>
</body>
</html>
